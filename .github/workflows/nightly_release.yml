name: Nightly DeFi Data Update (Release)

on:
  schedule:
    - cron: "20 2 * * *"  # nightly at 02:20 UTC
  workflow_dispatch: {}

permissions:
  contents: write

# Do not let a manual run and the scheduled run replace the same rolling
# release assets at the same time.
concurrency:
  group: nightly-defi-data-release
  cancel-in-progress: false

jobs:
  update-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pandas requests python-dotenv pyarrow tqdm plotly numpy eth-utils web3
      # 1) Download previous state.  data-latest is the fast path, while dated
      # releases are a verified fallback if a rolling asset is ever unavailable.
      - name: Download latest dataset state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(aave_data.zip uniswap_data.zip curve_data.zip eth_blocks_data.zip)

          retry() {
            local attempts=5 delay=5 attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${attempts} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          valid_archive() {
            [ -s "data/$1" ] && unzip -tq "data/$1" >/dev/null
          }

          mkdir -p data
          if gh release view data-latest >/dev/null 2>&1; then
            latest_asset_names=$(retry gh release view data-latest --json assets --jq '.assets[].name')
            for f in "${assets[@]}"; do
              if grep -Fxq "$f" <<< "$latest_asset_names"; then
                retry gh release download data-latest --pattern "$f" --dir data || true
              else
                echo "data-latest does not contain $f; it will be recovered from a dated snapshot."
              fi
            done
          else
            echo "No data-latest release found; checking dated snapshots."
          fi

          # A dated release is not modified after publication, so it is the
          # recovery source if a rolling asset is missing or corrupt.
          if ! snapshot_tags=$(retry gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}$")) | .tagName'); then
            echo "Could not list dated dataset releases." >&2
            exit 1
          fi

          for f in "${assets[@]}"; do
            if valid_archive "$f"; then
              continue
            fi

            echo "Rolling release is missing or has an invalid $f; recovering from a dated snapshot."
            rm -f "data/$f"
            recovered=false
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              if retry gh release download "$tag" --pattern "$f" --dir data && valid_archive "$f"; then
                echo "Recovered $f from $tag."
                recovered=true
                break
              fi
              rm -f "data/$f"
            done <<< "$snapshot_tags"

            if [ "$recovered" != true ]; then
              echo "No valid copy of $f was found in data-latest or a dated release." >&2
              exit 1
            fi
          done

          for f in "${assets[@]}"; do
            unzip -o "data/$f" -d .
          done
      # 2) Run your updater
      - name: Run data collection
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          python get_aave_hourly.py
          python update_blocks_to_time.py
          python update_crv_3pool.py
          python update_uniswap_metrics.py
          python update_hourly_liquidity.py
          python liquidations.py
          python eth_oracle.py
          python LP_distribution.py
          python non_NFPM_liquidity.py
          python update_3CRV_events.py
          python swap_size_curve.py
          python classify_addresses.py
      # 3) Package output
      - name: Zip dataset
        run: |
          zip -r aave_data.zip data/AAVE
          zip -r uniswap_data.zip data/Uniswap
          zip -r curve_data.zip data/Curve
          zip -r eth_blocks_data.zip data/ETH_blocks
      # 4) Publish a nightly snapshot release (archival)
      - name: Create nightly release + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            local attempts=5 delay=5 attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${attempts} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          TAG="data-$(date -u +%Y-%m-%d)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            retry gh release create "$TAG" \
              --title "DeFi hourly datasets $TAG" \
              --notes "Automated nightly snapshot"
          fi
          for f in aave_data.zip uniswap_data.zip curve_data.zip eth_blocks_data.zip; do
            retry gh release upload "$TAG" "$f" --clobber
          done
      # 5) Update rolling state release (so next run can download it)
      - name: Update rolling data-latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            local attempts=5 delay=5 attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${attempts} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          release_endpoint="repos/${{ github.repository }}/releases/tags/data-latest"
          asset_id() {
            gh api "$release_endpoint" --jq ".assets[] | select(.name==\"$1\" and .state==\"uploaded\") | .id" 2>/dev/null || true
          }
          any_asset_id() {
            gh api "$release_endpoint" --jq ".assets[] | select(.name==\"$1\") | .id" 2>/dev/null || true
          }

          if ! gh release view data-latest >/dev/null 2>&1; then
            retry gh release create data-latest --title "Latest DeFi dataset" --notes "Rolling state"
          fi

          for f in aave_data.zip uniswap_data.zip curve_data.zip eth_blocks_data.zip; do
            # Upload a uniquely named staging asset first.  The old asset stays
            # downloadable if GitHub's upload endpoint transiently fails.
            staged_name="${f}.staged-${GITHUB_RUN_ID}"
            staged_id=$(asset_id "$staged_name")
            if [ -z "$staged_id" ]; then
              # GitHub can leave an empty asset in the `starter` state after an
              # upstream upload failure.  It must be removed before retrying.
              incomplete_staged_id=$(any_asset_id "$staged_name")
              if [ -n "$incomplete_staged_id" ]; then
                retry gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$incomplete_staged_id"
              fi

              for attempt in 1 2 3 4 5; do
                gh release upload data-latest "${f}#${staged_name}" || true
                staged_id=$(asset_id "$staged_name")
                [ -n "$staged_id" ] && break
                incomplete_staged_id=$(any_asset_id "$staged_name")
                if [ -n "$incomplete_staged_id" ]; then
                  retry gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$incomplete_staged_id"
                fi
                if [ "$attempt" -lt 5 ]; then
                  delay=$((5 * 2 ** (attempt - 1)))
                  echo "Staged upload of $f failed; retrying in ${delay}s." >&2
                  sleep "$delay"
                fi
              done
            fi
            if [ -z "$staged_id" ]; then
              echo "Unable to stage $f; preserving the previous rolling asset." >&2
              exit 1
            fi

            old_id=$(any_asset_id "$f")
            if [ -n "$old_id" ]; then
              retry gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old_id"
            fi
            retry gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$staged_id" -f name="$f"

            if [ -z "$(asset_id "$f")" ]; then
              echo "Rolling release did not contain $f after promotion." >&2
              exit 1
            fi
          done
      # 6) Build updated Plotly figure 
      - name: Build Plotly HTML w/ updated data
        run: |
          mkdir -p site
          python plot_crv_interactive.py
          python plot_uni_interactive.py
      # 7) checkout GitHub Pages repo
      - name: Checkout Pages repo (ochaff.github.io)
        uses: actions/checkout@v4
        with:
          repository: ochaff/ochaff.github.io
          ref: main
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages
      # 8) Copy updated figure to pages repo
      - name: Copy site into repo
        run: |
          cp -f site/crv_balance.html pages/figures/
          cp -f site/uni_liquidity.html pages/figures/
      
      # 9) Commit and push updated figure
      - name: Commit and push Pages update
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Plotly figures" || exit 0
          git push origin main
      # 10) Notify Pages repo for dashboard update
      - name: Notify GitHub Pages repository
        env:
          PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/ochaff/ochaff.github.io/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PAGES_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"data-release"}'
